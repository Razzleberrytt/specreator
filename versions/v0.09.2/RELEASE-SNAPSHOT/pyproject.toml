[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-creator"
version = "0.9.2"
description = "Executable governed specification system with traceability, discovery, task compilation, prompt compilation, and recursive release verification"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[project.scripts]
spec-creator = "spec_creator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
