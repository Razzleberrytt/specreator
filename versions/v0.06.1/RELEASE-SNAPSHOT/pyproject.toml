[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-creator"
version = "0.6.1"
description = "Executable validator, spec linter, traceability engine, and ambiguity engine for Spec Creator"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[project.scripts]
spec-creator = "spec_creator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
